name: Auto Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release:
    name: Create release on version bump
    runs-on: ubuntu-latest

    permissions:
      contents: write  # create GitHub release

    outputs:
      tag: ${{ steps.create.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2

      - name: Check for version bump
        id: version
        run: |
          current=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          previous=$(git show HEAD~1:pyproject.toml 2>/dev/null \
            | grep '^version = ' | sed 's/version = "\(.*\)"/\1/')
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$current" != "$previous" ] && [ -n "$current" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        id: create
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.version.outputs.current }}"
          if gh release view "$tag" &>/dev/null; then
            echo "Release $tag already exists, skipping."
            echo "tag=" >> "$GITHUB_OUTPUT"
          else
            gh release create "$tag" --generate-notes --title "$tag"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build and push Docker image
    needs: release
    if: needs.release.outputs.tag != ''

    permissions:
      contents: read       # checkout
      packages: write      # push to GHCR
      attestations: write  # build provenance
      id-token: write      # sign attestation

    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit

  publish-pypi:
    name: Build and publish to PyPI
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    environment: pypi

    permissions:
      id-token: write   # OIDC trusted publishing
      contents: read    # checkout

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Build sdist and wheel
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
