name: CI

on:
  push:
    # release/** are long-lived integration branches for major versions. They
    # accumulate breaking changes across several PRs and merge to main once, as
    # a single version bump — so they need CI, while auto-release.yml stays
    # main-only and cannot fire from them.
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

permissions:
  contents: read

jobs:
  # Required by the main branch ruleset. If you rename this job, update the
  # ruleset at https://github.com/JasonPuglisi/e-note-ion/rules/13082160
  check:
    name: Lint, type-check, security scan, and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      - name: Bandit
        run: uv run bandit -c pyproject.toml -r .

      - name: pip-audit
        run: uv run pip-audit

      - name: Pretty-format JSON
        run: uv run pre-commit run pretty-format-json --all-files

      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=term --cov-report=xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  # Required by the main branch ruleset. If you rename this job, update the
  # ruleset at https://github.com/JasonPuglisi/e-note-ion/rules/13082160
  docker:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: e-note-ion:ci

      # `import scheduler` alone is not enough. health.py imports healthalert
      # lazily inside a timer callback, so v1.24.0 shipped without that module,
      # started cleanly, and raised ModuleNotFoundError 60s later — past every
      # check we had. Importing every root module catches the whole class.
      - name: Smoke test
        run: |
          docker run --rm e-note-ion:ci python -c "import scheduler"
          MODULES=$(ls *.py | sed 's/\.py$//' | tr '\n' ' ')
          echo "checking modules: $MODULES"
          docker run --rm e-note-ion:ci python -c "
          import importlib, sys
          missing = []
          for name in '$MODULES'.split():
              try:
                  importlib.import_module(name)
              except Exception as e:
                  missing.append(f'{name}: {e}')
          if missing:
              print('modules missing from the image:', *missing, sep='\n  ')
              sys.exit(1)
          print('all root modules import inside the image')
          "

      # config.toml is documented as a single-file bind mount, which pins the
      # inode and makes os.replace() fail with EBUSY. That is the only place
      # config._atomic_write()'s in-place fallback is exercised, and no unit
      # test can reproduce it. See #592.
      - name: Smoke test config writes under a single-file bind mount
        run: |
          printf '[scheduler]\nmodel = "note"\n' > smoke-config.toml
          chmod 666 smoke-config.toml
          docker run --rm \
            -v "$PWD/smoke-config.toml:/app/config.toml" \
            -v "$PWD/scripts/docker-config-smoke.py:/app/docker-config-smoke.py" \
            e-note-ion:ci python docker-config-smoke.py
          grep -q '\[smoke\]' smoke-config.toml
          # The point of this step is the fallback. If os.replace ever starts
          # succeeding under a single-file bind mount, the premise behind
          # config._atomic_write's errno handling changed and we want to know.
          docker run --rm \
            -v "$PWD/smoke-config.toml:/app/config.toml" \
            -v "$PWD/scripts/docker-config-smoke.py:/app/docker-config-smoke.py" \
            e-note-ion:ci python docker-config-smoke.py | tee smoke.out
          grep -q 'write path taken: in-place fallback' smoke.out

  # Advisory only — not required by the branch ruleset. Failures surface in
  # the PR checks list but do not block merge.
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    environment: integration  # secrets scoped to this env; restrict env to main in repo settings

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run integration tests
        run: uv run pytest -m integration -v
        env:
          BART_API_KEY: ${{ secrets.BART_API_KEY }}
          CALENDAR_URL: ${{ secrets.CALENDAR_URL }}
          CALENDAR_CALDAV_URL: ${{ secrets.CALENDAR_CALDAV_URL }}
          CALENDAR_USERNAME: ${{ secrets.CALENDAR_USERNAME }}
          CALENDAR_PASSWORD: ${{ secrets.CALENDAR_PASSWORD }}
          CALENDAR_CARDDAV_URL: ${{ secrets.CALENDAR_CARDDAV_URL }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          TRAKT_CLIENT_ID: ${{ vars.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
          TRAKT_ACCESS_TOKEN: ${{ secrets.TRAKT_ACCESS_TOKEN }}
          VESTABOARD_VIRTUAL_API_KEY: ${{ secrets.VESTABOARD_VIRTUAL_API_KEY }}
          DIVING_NDBC_STATION: ${{ vars.DIVING_NDBC_STATION }}
          DIVING_LAT: ${{ vars.DIVING_LAT }}
          DIVING_LON: ${{ vars.DIVING_LON }}
          PARCEL_API_KEY: ${{ secrets.PARCEL_API_KEY }}
          UPTIMEROBOT_API_KEY: ${{ secrets.UPTIMEROBOT_API_KEY }}
          YNAB_API_KEY: ${{ secrets.YNAB_API_KEY }}
          YNAB_BUDGET_ID: ${{ secrets.YNAB_BUDGET_ID }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
