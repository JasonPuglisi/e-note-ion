name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Required by the main branch ruleset. If you rename this job, update the
  # ruleset at https://github.com/JasonPuglisi/e-note-ion/rules/13082160
  check:
    name: Lint, type-check, security scan, and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      - name: Bandit
        run: uv run bandit -c pyproject.toml -r .

      - name: pip-audit
        run: uv run pip-audit --ignore-vuln CVE-2026-4539  # pygments ReDoS, dev-only, no fix available

      - name: Pretty-format JSON
        run: uv run pre-commit run pretty-format-json --all-files

      - name: Run tests
        run: uv run pytest

  # Required by the main branch ruleset. If you rename this job, update the
  # ruleset at https://github.com/JasonPuglisi/e-note-ion/rules/13082160
  docker:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build (no push)
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          push: false
          load: true
          tags: e-note-ion:ci

      - name: Smoke test
        run: docker run --rm e-note-ion:ci python -c "import scheduler"

  # Advisory only — not required by the branch ruleset. Failures surface in
  # the PR checks list but do not block merge.
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    environment: integration  # secrets scoped to this env; restrict env to main in repo settings

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run integration tests
        run: uv run pytest -m integration -v
        env:
          BART_API_KEY: ${{ secrets.BART_API_KEY }}
          CALENDAR_URL: ${{ secrets.CALENDAR_URL }}
          CALENDAR_CALDAV_URL: ${{ secrets.CALENDAR_CALDAV_URL }}
          CALENDAR_USERNAME: ${{ secrets.CALENDAR_USERNAME }}
          CALENDAR_PASSWORD: ${{ secrets.CALENDAR_PASSWORD }}
          CALENDAR_CARDDAV_URL: ${{ secrets.CALENDAR_CARDDAV_URL }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          TRAKT_CLIENT_ID: ${{ vars.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
          TRAKT_ACCESS_TOKEN: ${{ secrets.TRAKT_ACCESS_TOKEN }}
          VESTABOARD_VIRTUAL_API_KEY: ${{ secrets.VESTABOARD_VIRTUAL_API_KEY }}
          DIVING_NDBC_STATION: ${{ vars.DIVING_NDBC_STATION }}
          DIVING_LAT: ${{ vars.DIVING_LAT }}
          DIVING_LON: ${{ vars.DIVING_LON }}
          PARCEL_API_KEY: ${{ secrets.PARCEL_API_KEY }}
          UPTIMEROBOT_API_KEY: ${{ secrets.UPTIMEROBOT_API_KEY }}
          YNAB_API_KEY: ${{ secrets.YNAB_API_KEY }}
          YNAB_BUDGET_ID: ${{ secrets.YNAB_BUDGET_ID }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
