version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Workaround for dependabot/dependabot-core#13960: the uv FileFetcher
    # treats every .txt file in the repo as a pip requirements file and
    # chokes parsing LICENSE.txt. The upstream issue was closed as completed
    # on 2026-05-13, but this exclusion has not been re-tested since. Drop it
    # and confirm the next weekly uv run still opens PRs before removing.
    # NOTE: paths are repo-root-relative — leading slash is rejected by
    # Dependabot's config validator (the waylay-sdk-py example with leading
    # slash is wrong; ours uses the bare path).
    exclude-paths:
      - "LICENSE.txt"
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ["*"]
