version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # The LICENSE.txt exclude-paths workaround for
    # dependabot/dependabot-core#13960 was removed on 2026-09-06 (#595). That
    # upstream issue closed as completed on 2026-05-13; the PR our comment used
    # to cite, #14197, turned out to be an unrelated FileFetcher refactor that
    # never merged, so the fix landed elsewhere.
    #
    # If the weekly uv run starts failing to parse LICENSE.txt, restore:
    #   exclude-paths:
    #     - "LICENSE.txt"
    # Paths are repo-root-relative; a leading slash is rejected by Dependabot's
    # config validator.
    groups:
      all:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ["*"]
