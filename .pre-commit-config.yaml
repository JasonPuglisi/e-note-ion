repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0  # v6.0.0
    hooks:
      - id: pretty-format-json
        args: [--autofix, --indent=2, --no-sort-keys]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]

  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit
        # Audit the project's locked dependencies (same as CI's `uv run
        # pip-audit`), not pip-audit's own isolated pre-commit sandbox. The
        # upstream pypa/pip-audit hook audits that sandbox, which falsely
        # tripped on a pip CVE in the sandbox's own pip and blocked every
        # local commit. pip-audit's version is pinned via the dev dependency.
        entry: uv run pip-audit
        language: system
        pass_filenames: false
        always_run: true

      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false

      - id: check-version-bump
        name: check version bump
        entry: scripts/check-version-bump.sh
        language: script
        pass_filenames: false
        always_run: true

      - id: staged-integration-tests
        name: integration tests for staged integrations
        entry: scripts/staged-integration-tests.sh
        language: script
        pass_filenames: false
        always_run: true
