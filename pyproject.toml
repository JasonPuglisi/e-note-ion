[project]
name = "e-note-ion"
version = "1.22.1"
description = "Automation for Vestaboard displays — with emotion"
keywords = ["vestaboard", "note", "flagship", "automation", "schedule", "scheduling"]
authors = [
  { name = "Jason Puglisi", email = "jason@pugli.si" }
]
maintainers = [
  { name = "Jason Puglisi", email = "jason@pugli.si" }
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
    "Topic :: Utilities",
]
dependencies = [
    "apscheduler>=3.11.2",
    "argon2-cffi>=25.1.0",
    "caldav>=3.2.1",
    "icalendar>=7.1.2",
    "Pillow>=12.2.0",
    "recurring-ical-events>=3.8.2",
    "requests>=2.34.2",
]

[project.scripts]
e-note-ion = "scheduler:main"

[project.urls]
Homepage = "https://github.com/JasonPuglisi/e-note-ion"
Repository = "https://github.com/JasonPuglisi/e-note-ion"
Issues = "https://github.com/JasonPuglisi/e-note-ion/issues"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.setuptools]
py-modules = ["scheduler", "config", "exceptions"]

[tool.setuptools.packages.find]
include = ["integrations*"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pip-audit>=2.10.0",
    "pre-commit>=4.6.0",
    "pyright>=1.1.410",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.16",
]

[tool.bandit]
exclude_dirs = [".venv", "tests"]
# Add skips = ["BXXX"] here for any false positives that arise

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not integration'"
log_level = "DEBUG"
markers = [
  "integration: marks tests that call real external APIs (deselected by default)",
  "require_env: list env var names required for the test to run",
]

[tool.ruff]
line-length = 120
indent-width = 2

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I"]  # pycodestyle errors, pyflakes, isort

[tool.coverage.run]
# Measure coverage on the project source — integrations + root-level modules.
# Tests themselves are excluded; .venv is excluded by default.
source = ["integrations", "scheduler", "config", "health", "public", "quiet", "exceptions"]

[tool.coverage.report]
# Report-only — no fail_under threshold yet. Establish a baseline first; add
# a threshold once the number is known and intentional.
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
