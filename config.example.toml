# e-note-ion configuration
# Copy this file to config.toml and fill in your values.
# config.toml is git-ignored — never commit it.

[scheduler]
# Optional: IANA timezone name for date/time display in all integrations.
# Defaults to the system local timezone (TZ env var). Set this if you want
# to display times in a specific timezone regardless of the host's TZ setting.
# timezone = "America/Los_Angeles"

# Logging level: "DEBUG", "INFO" (default), "WARNING", "ERROR", "CRITICAL".
# Set to "DEBUG" to see per-integration cache hits, retry attempts, and
# detailed state transitions.
# log_level = "DEBUG"

# Display model: "note" (3×15, default) or "flagship" (6×22)
# model = "flagship"

# Public mode: skip templates marked private = true. Useful when the display
# is in a shared or guest-visible space.
# public = true

# Quiet mode: render content to virtual state instead of sending to the board.
# Written by the scheduler webhook — can also be set manually before startup.
# quiet = true

# Content filter. When absent, all user content loads and no contrib content
# loads. When set, the filter applies to both user and contrib directories:
#   ["*"]              — all user + all contrib
#   ["calendar", "weather"]  — only these stems from either directory
#   ["my_quotes"]      — only my_quotes.json from content/user/
# content_enabled = ["*"]

# Global minimum hold (seconds). Every message is guaranteed to display for at
# least this long before a queued high-priority message (priority >= 8) can
# interrupt it. Set to 0 to disable the floor (not recommended for physical
# displays — flaps need time to settle). Default: 60.
# min_hold = 60

# ── Calendar-driven gating (optional) ──────────────────────────────────────────
# Let calendar events open or close template gates. When the gate is closed for
# a template, its cron continues to fire but the enqueue is silently dropped
# until the gate reopens. Reuses the calendars configured under [calendar]
# (both ICS and CalDAV) — no extra calendar setup.
#
# In the event description, write keywords (one per line, case-insensitive):
#   vestaboard:bart                — open all templates in bart.json
#   vestaboard:bart.departures     — open just bart.departures
#   vestaboard:!discogs            — close all templates in discogs.json
#   vestaboard:!youtube.live       — close just youtube.live
#
# Use cases:
#   - "Show BART only on commute days" — list bart.departures in
#     gated_templates, then mark commute days on a calendar event with
#     "vestaboard:bart.departures" in the description.
#   - "Suppress vinyl spin during focus blocks" — drop a focus event with
#     "vestaboard:!discogs.morning_spin" in the description.
#
# Conflict resolution: deny wins. Specific template_id overrides win over
# stem-level. Webhook and refresh enqueues are not gated — only cron firings.
#
# [scheduler.calendar_schedule]
# # File stems or fully-qualified template ids that are closed by default.
# # Unlisted templates remain open by default and can only be closed via a
# # vestaboard:!name event.
# gated_templates = ["bart.departures"]

# ── Schedule overrides ─────────────────────────────────────────────────────────
# Override schedule fields or visibility for any named template without editing
# JSON. Section name: [<integration>.schedules.<template-name>]. All fields are
# optional; unspecified fields use the template's JSON default.
#
# Common fields (apply to every integration):
#   cron = "..."       — change when the template fires
#   hold = 300         — seconds to display before advancing
#   timeout = 1800     — seconds before discarding if not yet shown
#   priority = 5       — 0–10; higher number runs first
#   disabled = true    — skip this template entirely (overrides all other fields)
#   private = true     — hide in public mode (overrides the template's private field)

[vestaboard]
# Read/Write API key from https://store.vestaboard.com/pages/read-write-api
api_key = "your-vestaboard-read-write-api-key"

[bart]
# Free API key — register at https://api.bart.gov/api/register.aspx
api_key = "your-bart-api-key"

# Originating station abbreviation code.
# See full list: https://api.bart.gov/docs/overview/abbrev.aspx
station = "MLPT"

# Destination abbreviation code for the first departure line (required).
line1_dest = "DALY"

# Second departure line (optional — remove or leave blank for one line).
# line2_dest = "BERY"

# [bart.schedules.departures]
# cron = "*/5 7-9 * * 1-5"
# hold = 290
# timeout = 60
# priority = 8
# refresh_interval = 60  # re-fetch departure times every 60s during the hold (min 30)

[calendar]
# Fetch today's events from ICS feeds and/or a private iCloud account.
# Both modes can be active simultaneously — events are merged and sorted.

# ICS mode — public/secret-address feeds (any number of URLs).
# Google Calendar: Settings → calendar → "Secret address in iCal format"
# iCloud: share calendar → enable "Public Calendar" → copy link (replace webcal:// with https://)
# urls = [
#   "https://calendar.google.com/calendar/ical/.../basic.ics",
# ]

# Optional: Vestaboard color letter per URL, parallel to urls.
# Options: R (red), O (orange), Y (yellow), G (green), B (blue), V (violet), W (white), K (black)
# iCloud feeds auto-detect calendar color from the feed — omit to use it.
# colors = ["B", "G"]

# CalDAV mode — private iCloud calendars.
# Requires an app-specific password from appleid.apple.com (not your Apple ID password).
# caldav_url = "https://caldav.icloud.com/"
# username = "you@icloud.com"
# password = "xxxx-xxxx-xxxx-xxxx"
# calendar_names = ["Work", "Personal"]  # optional; default: all calendars

# CardDAV mode — iCloud Contacts birthdays (birthdays.json).
# Uses the same username and password as CalDAV mode above.
# Omit carddav_url to disable the birthdays integration entirely.
# The self-birthday template (birthdays.json/self) requires iCloud CardDAV.
# carddav_url = "https://contacts.icloud.com/"
# birthdays_lookahead_days = 7  # optional; default: 7

# [calendar.schedules.today]
# cron = "30 * * * *"
# hold = 300
# timeout = 1800
# priority = 5

[discogs]
# Personal access token (read-only) — generate at https://www.discogs.com/settings/developers
# Your username is resolved automatically from the token; no username key required.
token = "your-discogs-personal-access-token"

# Optional: collection folder ID (default: 0 = all releases).
# List your folders at https://www.discogs.com/users/<username>/collection
# folder_id = "0"

# [discogs.schedules.morning_spin]
# cron = "30 8 * * *"
# hold = 600
# timeout = 3600
# priority = 5

[diving]
# Scuba diving conditions — wave height, swell period, wind, and water temperature.
# Shows at 7:15am, 12:15pm, and 4:15pm. Color square in the header reflects
# subjective dive condition quality (green/yellow/red).

# NDBC buoy station ID (recommended for US coastal sites — real measured data).
# Find your nearest station at https://www.ndbc.noaa.gov/
# Example: 46014 = Point Arena, CA
# ndbc_station_id = "46014"

# Open-Meteo fallback — use instead of ndbc_station_id for non-US sites or
# locations without a nearby buoy. Accuracy near complex coastlines is limited.
# latitude = 36.6
# longitude = -121.9

# Unit system: "imperial" (ft, °F, default) or "metric" (m, °C).
# units = "imperial"

# Wind display unit: "knots" (default), "mph", or "kmh". Condition scoring
# always uses knots internally — only the displayed wind value changes.
# wind_units = "knots"

# Date of the most recent dive — written by the diving webhook, or
# set manually. Format: YYYY-MM-DD. Shows daily at 10am when present.
# last_dived_on = "2026-01-01"

# [diving.schedules.conditions]
# cron = "15 7,12,16 * * *"
# hold = 600
# timeout = 1800
# priority = 5
# refresh_interval = 1800

[message]
# Friend message integration — ad-hoc messages from registered friends via webhook.
# Friends are registered using the admin iOS Shortcut (see content/contrib/message.md).
# Each friend gets a unique 3-word passphrase that identifies them automatically.
#
# Friend display metadata and credential hashes are written here automatically
# by the registration action. Example (do not edit manually):
#
# [message.friends.alice]
# color = "R"          # R O Y G B V W K H (H = heart ❤️)
#
# (The corresponding [webhook.credentials.alice] entry is written to [webhook] below.)
#
# To override hold/timeout/priority for the notification template:
# [message.schedules.notification]
# hold = 60
# timeout = 60
# priority = 8

[parcel]
# Parcel package tracking — shows the soonest active delivery.
# Requires Parcel Premium ($4.99/year). Generate a key at web.parcelapp.net.
api_key = "your-parcel-api-key"

# [parcel.schedules.deliveries]
# cron = "15 9,15 * * *"
# hold = 600
# timeout = 1800
# priority = 5

[qbittorrent]
# Seeding stats from qBittorrent Web UI. Shows active seeding count and total
# seeded size. Requires the Web UI to be enabled in qBittorrent settings.
# ⚠  Local network only — do not expose the Web UI to the internet.
url = "http://192.168.1.50:8080"
username = "admin"
password = "your-webui-password"

# Skip TLS certificate verification (e.g. for self-signed certs).
# Only relevant when using https:// URLs. Default: true.
# verify_tls = false

# [qbittorrent.schedules.status]
# cron = "45 10 * * *"
# hold = 300
# timeout = 3600
# priority = 3

[plex]
# No settings are required. The play/pause/stop debounce window is hardcoded at
# 3 seconds. To override hold/timeout/priority for the now_playing or paused
# templates, add [plex.schedules.now_playing] or [plex.schedules.paused].

[ynab]
# Net worth tracker — sums all account balances from your YNAB budget.
# Personal access token — generate at https://app.ynab.com/settings/developer
api_key = "your-ynab-personal-access-token"

# Budget UUID — optional if you have only one budget (auto-detected).
# Find in the YNAB web app URL: app.ynab.com/<budget_id>/budget
# budget_id = "your-budget-id"

# [ynab.schedules.net_worth]
# cron = "15 11 * * *"
# hold = 300
# timeout = 3600
# priority = 3

[uptimerobot]
# Service outage alerts — polls every 5 minutes, displays only during outages.
# Free plan supports up to 50 monitors at 10 req/min.
# Get your API key from https://dashboard.uptimerobot.com/integrations
api_key = "your-uptimerobot-api-key"

# [uptimerobot.schedules.status]
# cron = "*/5 * * * *"
# hold = 300
# timeout = 120
# priority = 8
# refresh_interval = 60  # update elapsed downtime every 60s during hold (min 30)

[unraid]
# Unraid server status — array capacity and uptime. Requires Unraid 7.2+ and
# an API key from Settings → Management Access → API Keys.
# ⚠  Local network only — do not expose the Unraid API to the internet.
url = "http://192.168.1.10"
api_key = "your-unraid-api-key"

# Skip TLS certificate verification (e.g. for self-signed certs).
# Only relevant when using https:// URLs. Default: true.
# verify_tls = false

# [unraid.schedules.status]
# cron = "45 11 * * *"
# hold = 300
# timeout = 3600
# priority = 3

[tmdb]
# Optional: canonical media metadata authority for the Plex and Trakt integrations.
# When set, show/movie titles are resolved to their TMDb canonical form and Trakt
# episode numbers are corrected via TMDb (important for anime, which Trakt numbers
# using TVDb's single-season convention). When absent, integrations use their native
# titles and episode numbers unchanged.
#
# Free read access token — sign up at https://www.themoviedb.org and generate one at
# https://www.themoviedb.org/settings/api (under "API Read Access Token").
# api_read_access_token = "your-tmdb-api-read-access-token"

[google]
# Shared Google OAuth credentials — used by all Google API integrations (YouTube, etc.).
# Create a Google Cloud project, enable the APIs you need, then create an OAuth 2.0
# client ID of type "TVs and Limited Input devices" in the Credentials page.
# For personal use, the app can stay in "Testing" mode (no verification needed).
client_id = "your-google-oauth-client-id"
client_secret = "your-google-oauth-client-secret"

# Written by the auth flow — do not edit manually.
# Start the container, check logs for auth instructions, then approve in a browser.
# access_token = "..."
# refresh_token = "..."
# expires_at = 1234567890

# [youtube.schedules.live]
# cron = "45 12,20 * * *"
# hold = 300
# timeout = 3600
# priority = 4

[trakt]
# OAuth credentials — create an application at https://trakt.tv/oauth/applications/new
# Set Redirect URI to: urn:ietf:wg:oauth:2.0:oob
client_id = "your-trakt-client-id"
client_secret = "your-trakt-client-secret"

# Written by the auth flow — do not edit manually.
# Start the container, check logs for auth instructions, then approve in a browser.
# access_token = "..."
# refresh_token = "..."
# expires_at = 1234567890

# Optional: number of days ahead to show in the calendar (default 7, max 33)
# calendar_days = 7

[weather]
# City to display weather for. Geocoded via Open-Meteo on first call; no API
# key required.
city = "San Francisco"

# Unit system: "imperial" (°F, mph, default) or "metric" (°C, km/h).
# units = "imperial"

# [weather.schedules.conditions]
# cron = "0 * * * *"
# hold = 600
# timeout = 1800
# priority = 5

[webhook]
# Optional: enable the HTTP webhook listener so external systems (Plex,
# iOS Shortcuts, etc.) can push display messages to the board in real time.
# Remove the comment from this entire section to activate the listener.
#
# ⚠  Security: external webhook senders (outside your LAN) require TLS.
# Recommended: use Cloudflare Tunnel — no domain or cert management needed.
# See: https://github.com/JasonPuglisi/e-note-ion/blob/main/docs/webhook-reverse-proxy.md
#
# port = 8080
# Bind to 0.0.0.0 to accept connections from outside localhost (e.g. Docker/Unraid).
# Unraid: the template maps container port 8080 → host port 32800 by default.
# Requires a TLS-terminating reverse proxy for external webhook sources.
# bind = "0.0.0.0"

# Named credentials — one section per integration.
# Each credential is scoped to specific webhook endpoints via the webhooks list.
# To generate an argon2id hash for a plaintext secret:
#   python -c "from argon2 import PasswordHasher; print(PasswordHasher().hash('your-secret'))"
#
# [webhook.credentials.health]
# secret_hash = "$argon2id$v=19$m=65536,t=3,p=4$..."
# webhooks = ["health"]
# Auto-generated on first startup. Used to authenticate GET /health endpoint.
# Check the log for the plaintext secret.
#
# [webhook.credentials.scheduler]
# secret_hash = "$argon2id$v=19$m=65536,t=3,p=4$..."
# webhooks = ["scheduler"]
#
# [webhook.credentials.state]
# secret_hash = "$argon2id$v=19$m=65536,t=3,p=4$..."
# webhooks = ["state"]
# Auto-generated on first startup. Used to authenticate the GET /state endpoint
# (current board content + quiet/public toggle state — read by HomeBridge etc.).
# Check the log for the plaintext secret.
#
# [webhook.credentials.plex]
# secret_hash = "$argon2id$v=19$m=65536,t=3,p=4$..."
# webhooks = ["plex"]
#
# [webhook.credentials.notion]
# secret_hash = "$argon2id$v=19$m=65536,t=3,p=4$..."
# webhooks = ["notion"]
#
# Message integration credentials live in a nested namespace.
# The admin credential and all friend credentials are written automatically
# by the scheduler and registration action — see content/contrib/message.md.
#
# [webhook.credentials.message.admin]
# secret_hash = "$argon2id$v=19$m=65536,t=3,p=4$..."
# webhooks = ["message"]
#
# [webhook.credentials.message.friend.alice]
# secret_hash = "$argon2id$v=19$m=65536,t=3,p=4$..."
# webhooks = ["message"]

# [health]
# Optional: push a notification when overall health status changes, so a break
# reaches you without polling GET /health. When alert_url is absent, nothing is
# sent (the endpoint still works). See docs/health-alerts.md for recipes.
#
# alert_url — endpoint that receives the push. On each sustained transition,
#   e-note-ion sends POST <url> with JSON {"previous": "healthy", "current":
#   "error", "uptime_seconds": N, "unhealthy": {...}} where `unhealthy` carries
#   only the targets that are actually unwell. Works with Slack/Discord
#   webhooks, ntfy, Pushover, or a Home Assistant webhook trigger. Failures are
#   logged and never affect the scheduler.
# alert_url = "https://ntfy.sh/my-private-topic"
#
# alert_secret — sent as the X-Webhook-Secret header on the push. Optional;
#   omit for services that authenticate via the URL itself.
# alert_secret = "a-long-random-string"
#
# alert_confirm_seconds — how long a new status must hold before it is
#   reported. Stops a single failed run that recovers on the next one from
#   producing a healthy→error→healthy pair of alerts. Default: 120.
# alert_confirm_seconds = 120

# [homebridge]
# Optional: push quiet/public mode transitions to HomeBridge so the Apple Home
# switches update instantly instead of waiting for the next poll of GET /state.
# When this section is absent, no outbound notifications are sent (the plugin can
# still poll /state). See docs/homebridge.md for the full setup.
#
# url — the HomeBridge endpoint that receives the push. On each transition,
#   e-note-ion sends POST <url> with JSON {"characteristic": "quiet"|"public",
#   "value": true|false}. Use http://<homebridge-host>:<port>/ where <port>
#   matches the plugin's pushPort; the path is ignored. Failures are logged and
#   never block toggling.
# url = "http://homebridge.local:51828/"
#
# secret — sent as the X-Webhook-Secret header on the push. The companion plugin
#   auto-generates this and prints the plaintext in the Homebridge log once
#   (storing only a hash); copy that value here. Required when the plugin has a
#   secret set (it always does), or the push is rejected with 401.
# secret = "paste-the-plaintext-from-the-homebridge-log"
